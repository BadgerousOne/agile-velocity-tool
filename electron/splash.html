<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Agile Velocity Tool — Setup</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
  background: #1a1a2e;
  color: #e0e0e0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
  gap: 16px;
  user-select: none;
  -webkit-app-region: drag;
}
h1 { font-size: 20px; font-weight: 600; color: #fff; }
.subtitle { font-size: 12px; color: #7070a0; letter-spacing: 0.05em; text-transform: uppercase; }
.phase { font-size: 13px; color: #c0c0d0; min-height: 18px; }
.progress-track {
  width: 320px;
  height: 5px;
  background: #2a2a4a;
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #6366f1, #8b5cf6);
  border-radius: 3px;
  width: 0%;
  transition: width 0.25s ease;
}
.bytes { font-size: 11px; color: #6060a0; font-variant-numeric: tabular-nums; min-height: 16px; }
.error-msg { color: #f87171; font-size: 12px; text-align: center; max-width: 320px; line-height: 1.5; }
</style>
</head>
<body>
<h1>Agile Velocity Tool</h1>
<p class="subtitle">First-time setup</p>
<p class="phase" id="phase">Preparing…</p>
<div class="progress-track"><div class="progress-fill" id="bar"></div></div>
<p class="bytes" id="bytes">&nbsp;</p>
<p class="error-msg" id="err" style="display:none"></p>

<script>
const { ipcRenderer } = require('electron');

const phaseEl = document.getElementById('phase');
const barEl   = document.getElementById('bar');
const bytesEl = document.getElementById('bytes');
const errEl   = document.getElementById('err');

function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + ' GB';
  if (n >= 1e6) return (n / 1e6).toFixed(0) + ' MB';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + ' KB';
  return n + ' B';
}

ipcRenderer.on('ollama:status', (_, s) => {
  if (s.state === 'downloading') {
    phaseEl.textContent = s.phase === 'binary'
      ? 'Downloading Ollama…'
      : 'Downloading llama3.2 model…';
    const pct = s.total > 0 ? Math.min(100, (s.downloaded / s.total) * 100) : 0;
    barEl.style.width = pct + '%';
    bytesEl.textContent = s.total > 0
      ? `${fmt(s.downloaded)} / ${fmt(s.total)}`
      : (s.downloaded > 0 ? fmt(s.downloaded) : ' ');
  } else if (s.state === 'error') {
    phaseEl.textContent = 'Setup failed';
    barEl.style.width = '0%';
    bytesEl.textContent = ' ';
    errEl.textContent = (s.message ?? 'Setup error.') + ' The app will open — AI features require Ollama.';
    errEl.style.display = 'block';
  } else if (s.state === 'starting') {
    phaseEl.textContent = 'Starting Ollama…';
    barEl.style.width = '100%';
    bytesEl.textContent = ' ';
  }
});
</script>
</body>
</html>
